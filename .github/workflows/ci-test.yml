name: ci-test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # #867 split the e2e suite across two kind clusters (see CONTRIBUTING.md's "Running e2e
      # Tests Locally"); with two clusters there's no single "current context" for `make
      # test-e2e` to fall back to under ASSUME_CLUSTER_IS_CONFIGURED=true, so these two are
      # required in that mode. Named kstat-e2e*, not kstat-e2e-shared* like the local dev
      # clusters (Makefile's E2E_POOL_CLUSTER/E2E_CLUSTERWIDE_CLUSTER default), since a CI run's
      # clusters live only for that run and aren't shared across workers the way the local ones
      # are shared across worktrees/sessions. Set at job level so both the "Create kind cluster"
      # steps below and the `make test-e2e` step read the identical names.
      E2E_POOL_CONTEXT: kind-kstat-e2e
      E2E_CLUSTERWIDE_CONTEXT: kind-kstat-e2e-clusterwide
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
      - run: make test
        env:
          # See pkg/plugin/template_coverage.go: adds line-level .tmpl coverage as a side effect of
          # this same `make test` run (confirmed output-transparent, see
          # pkg/plugin/template_coverage_test.go) rather than a separate, duplicate test run.
          #
          # Must be absolute: `go test ./...` runs each package's test binary with its cwd set to
          # that package's own source directory (not the repo root), and env: values here are
          # literal strings -- GitHub Actions does not shell-expand them -- so a relative path
          # would land at e.g. pkg/plugin/unit-template-cover.out and cmd/unit-template-cover.out
          # instead of the repo root, where `make template-cover-html` below looks for it.
          # ${{ github.workspace }} is the one GH Actions expression usable here (it's substituted
          # before the shell ever runs); the e2e step below hits the same hazard but is a real
          # shell command, so it uses $(pwd) instead.
          KUBECTL_STATUS_TEMPLATE_COVERAGE: ${{ github.workspace }}/unit-template-cover.out
      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: cover.out
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload unit test results to Codecov
        # if: always() -- Test Analytics' main value (flaky-test detection, failure history)
        # comes from seeing failing runs too, not just green ones.
        # codecov/test-results-action is deprecated in favor of report_type: test_results on
        # this same action (https://github.com/codecov/test-results-action), so this reuses the
        # codecov-action already pinned above rather than pinning a second, sunsetting action.
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: unit-junit.xml
          flags: unittests
          report_type: test_results
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      # hack/versions.env is the single source of truth for the kind CLI version and the
      # digest-pinned node image (like every other dependency version in this repo), but
      # `with:` values can't be shell-expanded -- only ${{ }} expressions are substituted, and
      # there's no expression that reads a file. So the pins are read into step outputs here
      # and referenced below, rather than being duplicated (and left to drift) in this file.
      - name: Read kind pins from hack/versions.env
        id: kind-pins
        run: |
          # shellcheck disable=SC1091
          source hack/versions.env
          echo "version=${KIND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "node_image=${KIND_NODE_IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Create kind cluster (pool)
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          # Must match E2E_POOL_CONTEXT above (kind names the context "kind-"+cluster_name).
          cluster_name: kstat-e2e
          # version/node_image set explicitly rather than taking the action's defaults: those
          # currently give kind v0.31.0 and a k8s 1.35.x node image -- older than what
          # hack/versions.env pins -- and they'd move underneath us whenever the action moves.
          # The whole point of pinning the node image by digest is that CI and a local
          # `make e2e-cluster-up` render against the identical Kubernetes build.
          version: ${{ steps.kind-pins.outputs.version }}
          node_image: ${{ steps.kind-pins.outputs.node_image }}
          # Same single-node cluster shape as local runs -- see hack/kind-cluster.yaml.
          config: hack/kind-cluster.yaml
          wait: 300s
          # No CPU/memory sizing here, unlike the minikube step this replaced: a kind node is a
          # container with no CPU limit, so it already sees the whole runner. The `cpus: max`
          # input that used to be needed (the suite runs with -parallel=4, minikube defaulted to
          # 2 CPUs) has no kind equivalent and is no longer necessary.
          #
          # metrics-server and the default StorageClass's binding mode were minikube addons and
          # are not installed here: kind has no addons, so `make install-e2e-deps` (run as a
          # dependency of `make test-e2e` below) owns both, which also keeps CI and local runs
          # installing them the same way.
      - name: Create kind cluster (cluster-wide)
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          # #867's second cluster -- see the job-level env: comment above and
          # CONTRIBUTING.md's "Running e2e Tests Locally" for why TestE2EClusterWide/
          # TestE2EAgainstVanillaCluster need a cluster of their own. Must match
          # E2E_CLUSTERWIDE_CONTEXT above. Same version/node_image/config/wait as the pool
          # cluster -- see that step's comments; kind merges this cluster's context into the
          # same runner-default kubeconfig alongside the pool's rather than overwriting it, the
          # same way local shared.kubeconfig holds both (see the Makefile's "E2E cluster
          # identity" section).
          cluster_name: kstat-e2e-clusterwide
          version: ${{ steps.kind-pins.outputs.version }}
          node_image: ${{ steps.kind-pins.outputs.node_image }}
          config: hack/kind-cluster.yaml
          wait: 300s
      - name: Run e2e tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          # `make test-e2e` runs `go test ... -timeout=25m`, but this step's own timeout was
          # left at 15 -- lower than the test binary's own timeout, so a slow-but-legitimate run
          # gets hard-killed by this wrapper (Terminated, no per-subtest output) well before the
          # test binary would have reported a real -timeout failure, and the SIGTERM leaves the
          # cluster mid-install for whatever the retry's next attempt finds. A group that installs
          # a real controller via Helm (image pulls, multi-minute --wait) is the likeliest to push
          # total wall-clock past 15m on a slower runner, so 30 gives the 25m test timeout its own
          # headroom plus setup slack.
          timeout_minutes: 30
          max_attempts: 2
          # KUBECTL_STATUS_TEMPLATE_COVERAGE inlined here (rather than a step-level `env:`) since
          # nick-fields/retry runs `command:` as its own shell invocation -- see the unit test step
          # above for why this rides the existing test-e2e run instead of a separate one, and for
          # why the path must be absolute ($(pwd), since this line genuinely runs through a shell
          # unlike the unit step's env: block, where the equivalent ${{ github.workspace }} lives).
          command: ASSUME_CLUSTER_IS_CONFIGURED=true KUBECTL_STATUS_TEMPLATE_COVERAGE=$(pwd)/e2e-template-cover.out make test-e2e
      - name: Upload e2e test coverage to Codecov
        # if: always() -- uploads whatever coverage was captured even if a retry attempt of
        # the e2e step above failed; codecov-action just no-ops if cover-e2e.out is missing.
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: cover-e2e.out
          flags: e2e
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload e2e test results to Codecov
        # if: always() -- same rationale as the unit test results step above: a retry attempt
        # that ultimately failed should still surface in Test Analytics.
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: e2e-junit.xml
          flags: e2e
          report_type: test_results
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Render template coverage
        if: always()
        run: make template-cover-html
      - name: Upload template coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: template-cover.out
          flags: templates
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
