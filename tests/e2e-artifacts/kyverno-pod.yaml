# Applied into the dedicated e2e-kyverno-report namespace by applyManifestInNamespace, so it
# carries no metadata.namespace of its own. Deliberately violates two of
# tests/e2e-artifacts/kyverno-policies.yaml's rules and satisfies the third: no "team" label
# (fails require-team-label), no resource limits (warns via recommend-resource-limits, which is
# annotated non-scored), and a pinned image tag (passes check-image-tag).
apiVersion: v1
kind: Pod
metadata:
  name: report-target
  labels:
    app: report-target
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
