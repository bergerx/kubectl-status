# Hand-written rather than captured from a cluster: every field an Istio VirtualService or
# DestinationRule leaves optional is absent or empty here, which the fully-populated artifacts
# next to this one never exercise. A `Failed to render:` line or a literal <nil> in the .out is
# the bug this case exists to catch -- a render error aborts the whole object, so a template that
# trips over one missing field takes the conditions and events of the object someone is trying to
# debug down with it. See CONTRIBUTING.md § Working with Test Artifacts.
