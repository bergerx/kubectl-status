apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: resourceslice-rich-spec
  creationTimestamp: "2026-08-01T09:00:00Z"
spec:
  driver: gpu.nvidia.com
  perDeviceNodeSelection: true
  pool:
    name: rich-pool
    generation: 3
    resourceSliceCount: 2
  sharedCounters:
    - name: power-budget
      counters:
        watts:
          value: "1200"
  devices:
    - name: gpu-0
      nodeName: worker-1
      attributes:
        model:
          string: H100
      taints:
        - key: maintenance
          effect: NoSchedule
      consumesCounters:
        - counterSet: power-budget
          counters:
            watts:
              value: "300"
    - name: gpu-1
      allNodes: true
      allowMultipleAllocations: true
      attributes:
        model:
          string: H100
